<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5FAF">
<meta name="robots" content="noindex">
<title>Мобильный ЕБЦ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="leaflet.css">
<link rel="stylesheet" href="MarkerCluster.css">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
@font-face{font-family:"Liberation Serif";src:local("Liberation Serif"),url(LiberationSerif-Regular.ttf) format("truetype");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Liberation Serif";src:local("Liberation Serif Bold"),local("LiberationSerif-Bold"),url(LiberationSerif-Bold.ttf) format("truetype");font-weight:700;font-style:normal;font-display:swap}
:root{
  --ink:#1B2A3A; --muted:#5E6B78; --screen:#F3F5F7; --surface:#FFFFFF;
  --line:#E2E7EC; --blue:#1F5FAF; --bluebg:#E7EFFA; --yellow:#F2C230; --yellowbg:#FFF5D4;
  --yellowink:#8A6400; --green:#2E7D4F; --greenbg:#E4F2E9; --red:#B3261E; --redbg:#FBEAEA;
  /* цвета МЭС: голубой — про транзитодателя, оранжевый — про транзитоприёмников */
  --mesblue:#003264; --mesorange:#FF6408;
  --giverbg:#DCE9F7; --giverline:#A9C4E4; --recvbg:#FFE3D1; --recvink:#9A3A00; --recvline:#FFB98F;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{font-family:"Liberation Serif","Times New Roman",Times,serif;background:var(--screen);color:var(--ink);min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 14px 40px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* верхняя панель */
.appbar{position:sticky;top:0;z-index:5;background:var(--screen);padding:max(10px,env(safe-area-inset-top)) 0 10px}
.appbar .wrap{display:flex;align-items:center;gap:10px;padding-bottom:0}
.appbar .t{font-size:18px;font-weight:650;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.ib:active{background:var(--bluebg)}

/* поиск */
.hello{font-size:28px;font-weight:700;line-height:1.12;margin:18px 0 16px}
.search{margin-top:8px;display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--blue);border-radius:14px;padding:0 10px 0 12px;flex:1;min-width:0}
.search.compact{border-width:1px;border-color:var(--line)}
.search.compact:focus-within{border-color:var(--blue)}
.search svg{color:var(--blue)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;padding:12px 0}
input[type=search]::-webkit-search-cancel-button,input[type=search]::-webkit-search-decoration{-webkit-appearance:none;display:none}
.search .clear{color:var(--muted);padding:6px;display:none}
.search.has .clear{display:block}
.hint{font-size:13px;color:var(--muted);margin:8px 2px 20px;line-height:1.45}
.mapbtn{display:flex;align-items:center;gap:12px;background:var(--blue);color:#fff;border-radius:14px;padding:14px;font-weight:600;font-size:17px;width:100%;text-align:left}
.mapbtn small{display:block;font-weight:400;font-size:14.5px;opacity:.85}
.mapbtn[disabled]{background:#9DB3D0;cursor:default}
.mapbtn svg{width:28px;height:28px}
.mapbtn.dark{background:var(--mesblue);margin-top:10px}
.mapbtn.dark[disabled]{background:#8497AD}
.stat small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.onmap{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:8px;border:1.5px solid var(--blue);color:var(--blue);border-radius:12px;padding:10px;font-weight:600;font-size:14.5px}
.onmap[disabled]{border-color:var(--line);color:var(--muted);cursor:default}

/* ===== карты ===== */
body.mapmode{overflow:hidden}
body.mapmode .appbar,body.mapmode #view{display:none}
.mapwrap{position:fixed;inset:0;z-index:15;background:#EDEFE8}
.lmap{position:absolute;inset:0}
.leaflet-container{font-family:inherit;background:#EDEFE8}
.leaflet-control-attribution{font-size:10px}
.mtop{position:absolute;left:10px;right:10px;top:max(10px,env(safe-area-inset-top));z-index:1000;pointer-events:none;max-width:620px;margin:0 auto}
.mtop>*{pointer-events:auto}
.rowf{display:flex;gap:8px;align-items:center}
.mtop .ib{box-shadow:0 2px 8px rgba(27,42,58,.18)}
.pill{flex:1;min-width:0;background:#fff;border-radius:12px;padding:7px 12px;box-shadow:0 2px 8px rgba(27,42,58,.18)}
.pill b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pill span{font-size:12px;color:var(--muted)}
.tgl{display:inline-flex;align-items:center;gap:8px;margin-top:8px;background:#fff;border-radius:20px;padding:6px 8px 6px 10px;font-size:14px;font-weight:700;box-shadow:0 2px 8px rgba(27,42,58,.18)}
.tgl .tb{color:var(--mesblue);display:flex}.tgl .tb svg{width:16px;height:16px}
.tgl .sw{width:32px;height:19px;border-radius:10px;background:#C9D1D9;position:relative;transition:background .15s}
.tgl .sw i{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:left .15s}
.tgl.on .sw{background:var(--mesblue)}.tgl.on .sw i{left:15px}
.hintchip{display:inline-block;margin:8px 0 0 8px;background:var(--ink);color:#fff;font-size:12.5px;border-radius:14px;padding:6px 11px}
.mctlwrap{position:absolute;right:10px;top:34%;z-index:1000;display:flex;flex-direction:column;gap:42px}
.mctl{display:flex;flex-direction:column;background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(27,42,58,.18);overflow:hidden}
.mb.solo{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(27,42,58,.18)}
.mctl2{display:flex;flex-direction:column;gap:10px}
.mb.lay{color:var(--muted)}
.ylogo{display:block;margin:0 6px 4px 0!important;line-height:0}
.ylogo img{height:22px;width:auto}
.ylogo.txt{line-height:1.2;background:rgba(255,255,255,.9);color:#000;font:600 11px Arial,sans-serif;padding:3px 6px;border-radius:6px;text-decoration:none}
.mb{width:42px;height:42px;display:grid;place-items:center;font-size:22px;line-height:1}
.mb+.mb{border-top:1px solid var(--line)}
.mb.loc{color:var(--muted)}.mb.loc.on{color:var(--blue)}.mb.loc.wait{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
.mlegend{position:absolute;left:10px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:1000;background:#fff;border-radius:14px;padding:9px 13px;box-shadow:0 2px 10px rgba(27,42,58,.2);font-size:13.5px}
.lg{display:flex;align-items:center;gap:10px;min-height:28px}
.lg>span{position:relative;flex:none;margin:0 5px}
.mbottom{position:absolute;left:10px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:900}
.nocoord{background:#fff;border-radius:12px;padding:9px 12px;font-size:13.5px;box-shadow:0 2px 8px rgba(27,42,58,.18)}
.nocoord b{color:var(--blue);margin-left:6px}.nocoord.static{color:var(--muted)}
.nocoord[disabled]{color:var(--ink);cursor:default}
/* режим «указать точку на карте»: метка всегда в центре, двигается карта */
.pickpin{position:absolute;left:50%;top:50%;width:36px;height:48px;margin:-48px 0 0 -18px;z-index:1001;pointer-events:none}
.pickpin svg{width:36px;height:48px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.mapwrap.picking .mbottom{left:0;right:0;bottom:0}
.pickbar{background:#fff;border-radius:20px 20px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(27,42,58,.18);max-width:640px;margin:0 auto}
.pickbar p{font-size:14.5px;color:var(--muted);margin-bottom:4px;text-align:center}
.fixnote{margin-top:8px;background:#FFF1E6;border:1px solid var(--recvline);color:var(--recvink);border-radius:10px;padding:8px 10px;font-size:13.5px;font-weight:600}
.mannote{margin-top:8px;color:var(--mesblue);font-size:13.5px;font-weight:600}
.fixinfo{font-size:13px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.linkbtn.danger{color:var(--red)}
.stat .linkbtn{padding:0;font-size:13px;margin-left:6px}
.msheet{position:absolute;left:0;right:0;bottom:0;z-index:1100;background:#fff;border-radius:20px 20px 0 0;padding:6px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(27,42,58,.18);max-height:62vh;overflow-y:auto;max-width:640px;margin:0 auto}
.msheet.tall{max-height:66vh}
/* полоса сверху окошка: за неё окошко смахивается вниз; отступ до текста увеличен вдвое */
.msheet .grab{display:block;height:32px;margin:-6px -16px 9px;position:relative;touch-action:none;cursor:grab}
.msheet .grab i{position:absolute;left:50%;top:11px;width:46px;height:5px;margin-left:-23px;border-radius:3px;background:#C3CBD4}
.msheet .btn{margin-top:12px}
.msheet .trl{margin-top:8px}
.subh{display:flex;gap:12px;align-items:center}
.subh .st{font-size:17px;font-weight:700;line-height:1.3}
.st{font-weight:700}
.tag{display:inline-block;margin-top:4px;font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px}
.tag.priv{background:var(--greenbg);color:var(--green)}.tag.net{background:#DCE9F7;color:var(--mesblue)}.tag.pc{background:var(--redbg);color:var(--red)}
.desc{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;font-size:14.5px;line-height:1.45}
.desc p{margin:0 0 5px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.desc p.copied{background:var(--bluebg);border-radius:4px}
.desc a{color:var(--blue);text-decoration:underline;white-space:nowrap}
.desc .muted{color:var(--muted)}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line)}
.srow svg{width:16px;height:16px;color:var(--muted)}
.msearch{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:0 6px 0 11px;box-shadow:0 2px 8px rgba(27,42,58,.18)}
.msearch:focus-within{box-shadow:0 0 0 2px var(--blue),0 2px 8px rgba(27,42,58,.18)}
.msearch svg{color:var(--blue)}
.msearch input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;padding:11px 0}
.msearch input::-webkit-search-cancel-button{display:none}
.msearch .x{color:var(--muted);padding:6px;display:flex}
.sdrop{margin-top:8px;background:#fff;border-radius:14px;box-shadow:0 6px 20px rgba(27,42,58,.22);max-height:min(60vh,520px);overflow-y:auto}
.dh{font-size:13px;color:var(--muted);padding:9px 13px 5px}
.ri{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 13px;border-top:1px solid var(--line)}
.ri:active{background:#F7F9FB}
.ri .rt{flex:1;min-width:0;font-size:15px}.ri .rt>span{color:var(--muted);font-size:13px}
.ri small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri>svg{width:16px;height:16px;color:#B0BAC4}
/* значки на карте */
.mk-eo{width:22px;height:22px;border-radius:50%;background:var(--mesorange);border:2.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.2),0 1px 3px rgba(0,0,0,.25);box-sizing:border-box;display:inline-block}
.mk-eo.apx{background:rgba(255,100,8,.3);border:2px dashed var(--mesorange);box-shadow:none}
.mk-eo.man{border:3.5px solid var(--mesblue)}
.mk-eo.fix{background:#fff;border:6px solid var(--mesorange);box-shadow:0 0 0 2px var(--mesblue)}
.mk-eo.none{background:#C9D1D9;box-shadow:none}
.mk-selring{border-radius:50%;border:3px solid var(--mesorange);background:rgba(255,100,8,.14);box-sizing:border-box}
.lg .mk-eo{width:18px;height:18px}
.ri .mk-eo{width:16px;height:16px;flex:none;border-width:2px}
.ri.nomap .rt b{color:var(--muted)}
.ri .rt small+small{margin-top:1px}
.mk-sub{width:16px;height:16px;border-radius:3px;border:1.6px solid #fff;box-sizing:border-box;display:inline-grid;place-items:center;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.mk-sub .bolt{width:10px;height:10px;fill:#fff}
.mk-sub.net{background:var(--mesblue)}.mk-sub.priv{background:var(--green)}
.mk-sub.pc{width:26px;height:26px;border-radius:5px;border-width:2px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700}
.mk-sub.pc b{font-weight:700;font-size:10.5px;line-height:1}
.mk-sub.sel{box-shadow:0 0 0 3px var(--mesorange),0 0 0 9px rgba(255,100,8,.22)}
.mk-sub.big{width:32px;height:32px;border-radius:6px;flex:none}.mk-sub.big .bolt{width:18px;height:18px}.mk-sub.big.pc b{font-size:13px}
.mk-cl div{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;border:2.5px solid #fff;box-sizing:border-box}
.mk-cl.eo div{background:var(--mesorange);box-shadow:0 0 0 6px rgba(255,100,8,.22)}
.mk-cl.sub div{background:var(--mesblue);box-shadow:0 0 0 6px rgba(0,50,100,.18)}
.mk-po div{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--mesblue);color:#fff;font-weight:700;font-size:14px;border:2.5px solid #fff;box-shadow:0 0 0 6px rgba(0,50,100,.18);box-sizing:border-box}
.mk-po em{position:absolute;left:50%;top:50px;transform:translateX(-50%);white-space:nowrap;font-style:normal;font-weight:700;font-size:12.5px;color:var(--mesblue);text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
.mapwrap.far .mk-sub.pc{width:19px!important;height:19px!important;margin-left:-9px!important;margin-top:-9px!important;border-radius:4px}
.mapwrap.far .mk-sub.pc b{font-size:8px}
.mk-pin svg{width:30px;height:40px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.mk-me{width:18px;height:18px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25),0 0 0 7px rgba(31,95,175,.18);box-sizing:border-box;display:inline-block}
.sublabel{background:#fff;border:1px solid var(--mesblue);color:var(--mesblue);font-weight:700;font-size:12.5px;border-radius:10px;padding:1px 8px;box-shadow:none}
.sublabel::before{display:none}
.sub{margin-top:24px;font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:7px 12px;font-size:13.5px}
.basebar{margin-top:28px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;line-height:1.45}
.basebar b{color:var(--blue);font-weight:600;white-space:nowrap}
.basebar.stale{border-color:var(--yellow);background:var(--yellowbg);color:var(--yellowink)}

/* результаты */
.count{font-size:13px;color:var(--muted);margin:12px 2px 8px}
/* каждая ЭО — отдельная карточка */
.list{display:flex;flex-direction:column;gap:10px}
.row{display:block;width:100%;text-align:left;padding:12px 13px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(27,42,58,.06)}
.row:active{background:#F7F9FB}
.r1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.name{font-weight:650;font-size:15px;line-height:1.3;word-break:break-word}
.meta{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.45;word-break:break-word}
mark{background:#FDE9A0;color:inherit;border-radius:3px;padding:0 1px}
.badge{font-size:11.5px;font-weight:650;border-radius:6px;padding:3px 7px;white-space:nowrap;flex:none}
.b-B{background:var(--greenbg);color:var(--green)}
.b-T{background:var(--yellowbg);color:var(--yellowink)}
.b-x{background:#EEF1F4;color:var(--muted)}
.b-pu{background:var(--bluebg);color:var(--blue)}
.pus{margin-top:8px;border-top:1px dashed var(--line);padding-top:5px}
.pu{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;padding:3px 0}
.pu.hit span:first-child{font-weight:650}
.trl{display:inline-block;margin:8px 6px 0 0;font-size:12px;font-weight:650;border-radius:6px;padding:3px 8px;line-height:1.35}
.trl.giver{background:var(--giverbg);color:var(--mesblue);border:1px solid var(--giverline)}
.trl.recv{background:var(--recvbg);color:var(--recvink);border:1px solid var(--mesorange)}
.why{font-size:12px;color:var(--blue);margin-top:4px}
.more{display:block;width:100%;margin-top:10px;padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--blue);font-weight:600;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:14.5px;line-height:1.5}

/* карточка */
.head{background:var(--surface);border-radius:14px;border:1px solid var(--line);padding:14px}
.head .name{font-size:18px}
.warn{border-radius:12px;padding:11px 12px;margin-top:10px;font-size:13.5px;line-height:1.4}
.warn .wt{display:flex;gap:8px;align-items:center;font-weight:650}
.warn .wt svg{width:18px;height:18px}
.warn.giver{background:var(--giverbg);border:1px solid var(--giverline)}
.warn.giver .wt,.warn.giver .link .name{color:var(--mesblue)}
.warn.recv{background:var(--recvbg);border:1px solid var(--mesorange)}
.warn.recv .wt{color:var(--recvink)}
.warn.recv .wt svg{color:var(--mesorange)}
.link{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 0;border-top:1px solid var(--recvline)}
.warn.giver .link{border-top-color:var(--giverline)}
.link:first-of-type{margin-top:6px}
.link svg{width:16px;height:16px;color:var(--muted)}
.link .meta{margin-top:1px}
.orphan{padding:8px 0;border-top:1px solid var(--recvline);color:var(--recvink);font-size:13px}
.linkbtn{color:var(--blue);font-weight:600;font-size:13.5px;padding:8px 0 0}
details.acc{margin-top:10px;background:var(--surface);border-radius:14px;border:1px solid var(--line);overflow:hidden}
details.acc>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:13px 14px;font-weight:650;font-size:15px;cursor:pointer}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary svg{width:18px;height:18px;color:var(--muted);transition:transform .2s}
details.acc[open]>summary svg{transform:rotate(180deg)}
.kv{padding:0 14px 12px}
.kv .f{padding:7px 0;border-top:1px dashed var(--line)}
.kv .f span{display:block;font-size:12px;color:var(--muted);margin-bottom:1px}
.kv .f b{display:block;font-weight:500;font-size:14.5px;word-break:break-word;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.kv .f b.copied{background:var(--bluebg);border-radius:4px}
.pucard{margin:0 14px 12px;border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.pucard .kv{padding:0;margin-top:6px}
.pucard .note{margin-top:8px;background:var(--recvbg);border:1px solid var(--mesorange);color:var(--recvink);border-radius:8px;padding:7px 9px;font-size:13px;line-height:1.35}
.pucard .note button{color:var(--mesblue);font-weight:600;text-align:left;text-decoration:underline}
.nopu{padding:0 14px 12px;color:var(--muted);font-size:14px}
.pu-title{font-size:15px;font-weight:650}
.grid2{display:grid;grid-template-columns:1fr 1fr;column-gap:12px}
.grid2 .f.w{grid-column:1/-1}

/* данные */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.card h2{font-size:16px;margin-bottom:8px}
.card p{font-size:14px;color:var(--muted);line-height:1.5}
.stat{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px dashed var(--line);font-size:14px}
.stat:first-of-type{border-top:0}
.stat span{color:var(--muted)}
.stat b{font-weight:600;text-align:right;word-break:break-all}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:12px;font-weight:600;font-size:15px;margin-top:10px;text-align:center}
.btn.primary{background:var(--blue);color:#fff}
.btn.secondary{background:var(--surface);border:1.5px solid var(--blue);color:var(--blue)}
.btn.danger{color:var(--red);border:1px solid var(--line);background:var(--surface)}
.btn[disabled]{opacity:.5;cursor:default}
.progress{margin-top:12px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .2s}
.progress p{font-size:13px;color:var(--muted);margin-top:6px}
.err{margin-top:12px;background:var(--redbg);color:var(--red);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.4}
.steps{font-size:14px;line-height:1.55;color:var(--ink);padding-left:20px;margin-top:6px}
.steps li{margin:3px 0}

/* всплывашки */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;font-size:14px;padding:10px 16px;border-radius:22px;max-width:calc(100% - 32px);z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.modal{position:fixed;inset:0;background:rgba(27,42,58,.45);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:600px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheet h2{font-size:18px;margin-bottom:6px}
.sheet p{font-size:14px;color:var(--muted);line-height:1.45}
.sheet input[type=password],.sheet input[type=text]{width:100%;margin-top:12px;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:16px;outline:0}
.sheet input:focus{border-color:var(--blue)}
.check{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:14px}
.check input{width:20px;height:20px}
.row2{display:flex;gap:10px}
.row2 .btn{flex:1}
.splash{display:grid;place-items:center;min-height:70vh;color:var(--muted);font-size:15px}

/* главная без запроса: логотип и лозунг сверху, поиск посередине экрана, кнопки карт ниже */
.homelogo{display:none}
body.home-idle .homelogo{display:grid;place-items:center;height:calc(50vh - 86px);min-height:150px}
.homelogo>div{display:flex;flex-direction:column;align-items:center}
.homelogo img{width:clamp(80px,30vw,128px);height:auto;border-radius:22%;box-shadow:0 6px 18px rgba(0,50,100,.18)}
.slogan{margin-top:12px;font-size:14px;color:var(--muted);font-style:italic;letter-spacing:.2px;text-align:center;padding:0 20px}
body.home-idle .search{margin-top:0}
body.home-idle .mapbtns{margin-top:28px}

/* выдача по договорам и экран договора */
.b-obj{background:#E8EEF6;color:var(--mesblue)}
.found{color:var(--mesorange);font-weight:650}
.cgo{display:flex;align-items:center;gap:2px;margin-top:8px;color:var(--blue);font-weight:600;font-size:13.5px}
.cgo svg{width:16px;height:16px}
.ehit{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(27,42,58,.06)}
.ehit .row{border:0;border-radius:0;box-shadow:none}
.ctl{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:10px 13px;border-top:1px solid var(--line);background:#F8FAFC;font-size:13px;color:var(--muted);text-align:left}
.ctl b{display:flex;align-items:center;gap:2px;color:var(--blue);font-weight:600;white-space:nowrap}
.ctl svg{width:15px;height:15px}
.eomini{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:10px;padding:9px 11px}
.eomini:active{background:#F7F9FB}
.em1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.eomini .ea{font-size:15px;font-weight:650;line-height:1.3}
.eomini .meta{font-size:12.5px;margin-top:3px}
.tchip{display:inline-block;margin-top:5px;font-size:11.5px;font-weight:650;border-radius:6px;padding:2px 7px}
.tchip.r{background:var(--recvbg);color:var(--recvink)}.tchip.g{background:var(--giverbg);color:var(--mesblue)}
</style>
</head>
<body>
<header class="appbar"><div class="wrap" id="bar"></div></header>
<main class="wrap" id="view"><div class="splash">Открываю базу…</div></main>
<div id="mapC" class="mapwrap" hidden></div>
<div id="mapS" class="mapwrap" hidden></div>
<div id="toast" class="toast" hidden></div>
<div id="modal" class="modal" hidden></div>
<input type="file" id="file" accept=".zip,.csv,application/zip,text/csv" hidden>
<script src="config.js"></script>
<script src="leaflet.js"></script>
<script src="leaflet.markercluster.js"></script>
<script src="maps.js"></script>
<script src="app.js"></script>
</body>
</html>
